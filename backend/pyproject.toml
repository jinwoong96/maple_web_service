[project]
name = "backend"
version = "0.1.0"
description = "maple_web_service backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "streamlit>=1.62.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Function-scoped event loops (pytest-asyncio's default) break the async
# SQLAlchemy engine in app/db/session.py: it's created once at import time
# and its asyncpg connections get bound to whichever loop first used them,
# so a later test's fresh loop can't reuse them (Windows' Proactor loop in
# particular raises AttributeError deep in asyncio internals when this
# happens). Both need to be "session", not just the fixture one — a fixture
# built on the session loop but exercised by a function-scoped test loop
# hits the same cross-loop problem, just intermittently (only surfaced when
# multiple DB tests ran in the same file, not in isolation).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
